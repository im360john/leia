<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Snowflake Integration</title>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    
    const SUPABASE_URL = 'https://ievsqjsqurnvsbzczuhc.supabase.co'
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldnNxanNxdXJudnNiemN6dWhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzYzODcwNzYsImV4cCI6MjA1MTk2MzA3Nn0.b_zAYqLUC0x_w1njaCKGM2TUZu6z_V5IDV2oqQwmvCQ'
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    
    function log(message, data = null) {
      const output = document.getElementById('output')
      const entry = document.createElement('div')
      entry.className = 'log-entry'
      entry.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong> ${message}`
      if (data) {
        const pre = document.createElement('pre')
        pre.textContent = JSON.stringify(data, null, 2)
        entry.appendChild(pre)
      }
      output.appendChild(entry)
    }
    
    async function testSnowflakeConnection() {
      try {
        // Sign in
        log('Signing in to Supabase...')
        const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
          email: 'john@treez.io',
          password: 'password123',
        })
        
        if (authError) {
          throw new Error(`Auth failed: ${authError.message}`)
        }
        
        log('✓ Successfully authenticated', {
          userId: authData.user?.id,
          email: authData.user?.email
        })
        
        // Test 1: Get schema
        log('\nTesting schema query...')
        const { data: schemaData, error: schemaError } = await supabase.functions.invoke('snowflake-query', {
          body: { 
            type: 'schema',
            table: 'CUSTOMER_FACT'
          }
        })
        
        if (schemaError) {
          log('❌ Schema query failed', schemaError)
        } else {
          log('✓ Schema query successful', schemaData)
        }
        
        // Test 2: Get count
        log('\nTesting count query...')
        const { data: countData, error: countError } = await supabase.functions.invoke('snowflake-query', {
          body: { 
            type: 'count',
            whereClause: 'TOTAL_SPEND > 1000'
          }
        })
        
        if (countError) {
          log('❌ Count query failed', countError)
        } else {
          log('✓ Count query successful', countData)
        }
        
        // Test 3: Get preview
        log('\nTesting preview query...')
        const { data: previewData, error: previewError } = await supabase.functions.invoke('snowflake-query', {
          body: { 
            type: 'preview',
            limit: 5
          }
        })
        
        if (previewError) {
          log('❌ Preview query failed', previewError)
        } else {
          log('✓ Preview query successful', {
            ...previewData,
            data: {
              ...previewData?.data,
              rows: previewData?.data?.rows?.slice(0, 2) // Only show first 2 rows
            }
          })
        }
        
        // Sign out
        await supabase.auth.signOut()
        log('\n✓ Signed out')
        
      } catch (error) {
        log('❌ Test failed: ' + error.message, error)
      }
    }
    
    // Run test when page loads
    window.addEventListener('load', () => {
      document.getElementById('runTest').addEventListener('click', testSnowflakeConnection)
    })
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    #output {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 20px;
      margin-top: 20px;
      max-height: 600px;
      overflow-y: auto;
    }
    .log-entry {
      margin-bottom: 15px;
      padding: 10px;
      border-left: 3px solid #007bff;
      background-color: #f8f9fa;
    }
    .log-entry strong {
      color: #666;
    }
    pre {
      background-color: #e9ecef;
      padding: 10px;
      border-radius: 3px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>Test Snowflake Integration</h1>
  <button id="runTest">Run Test</button>
  <div id="output"></div>
</body>
</html>
